services:
  homelab:
    image: ${HOMELAB_IMAGE:-ghcr.io/kombifyio/homelab-open-core}:${IMAGE_TAG:?Set IMAGE_TAG to a published vX.Y.Z tag}
    restart: unless-stopped
    ports:
      - "${HOMELAB_BIND:-127.0.0.1}:${HOMELAB_PORT:-5260}:5260"
      - "${HOMELAB_GRPC_BIND:-127.0.0.1}:${HOMELAB_GRPC_PORT:-5263}:5263"
    environment:
      KOMBIFY_EDITION: selfhost-oss
      HOMELAB_AUTH_MODE: local
      HOMELAB_DATA_DIR: /data
      HOMELAB_V2_SESSION_SECRET: ${HOMELAB_V2_SESSION_SECRET:?Generate and set HOMELAB_V2_SESSION_SECRET}
      HOMELAB_ENCRYPTION_KEY: ${HOMELAB_ENCRYPTION_KEY:?Generate and retain a 32-byte HOMELAB_ENCRYPTION_KEY}
      DATABASE_URL: postgres://homelab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/homelab?sslmode=disable
      HOMELAB_PUBLIC_ORIGIN: ${HOMELAB_PUBLIC_ORIGIN:-}
      HOMELAB_CORS_ORIGINS: ${HOMELAB_CORS_ORIGINS:-}
    volumes:
      - homelab-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5260/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: homelab
    volumes:
      - homelab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab -d homelab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homelab-data:
  homelab-postgres-data:
